[package]
name = "souther-wasm-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The rules for reading text Souther shares with Raoh: case conversion, normalization, White_Space,
# order and length in scalar values, temporal text, and the image a pattern's machine is written as.
# Pinned to a commit until the crate is published, so that what the runtime builds is the same
# everywhere and the carried copy can be compared with it. The Java side takes the same library's
# Java implementation.
notation199x = { git = "https://github.com/raoh-project/199x-notation", rev = "46b73e9bc219acbb7f6f89f710d53dc122cb4f1a" }
# Exact arithmetic: what a `Rational` is and what each operation on one answers, the native
# runtime's answers from the same source, with neither backend depending on the other. Where one
# is kept and what a failure ends the call as are this runtime's (`rational`). A commit, for the
# reason 199x-notation is one.
souther-exact = { git = "https://github.com/souther-lang/souther-runtime-rs", rev = "c595095d9d577bb5cc29f88bb9261185ed984006" }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
