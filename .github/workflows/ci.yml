name: CI

on:
  # Every branch. Work happens on a feature branch here, so naming two would mean the build ran
  # on nothing that was being worked on.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `-U`: this build depends on `souther-runtime` as a SNAPSHOT from a separate repository.
      # setup-java's Maven cache persists `~/.m2/repository` (and Maven's own "already checked
      # today" markers) across runs, so without `-U` a same-day run can keep resolving a
      # SNAPSHOT version cached before an upstream souther-runtime change landed, and fail on a
      # symbol that already exists upstream — not a build failure, a stale-dependency failure
      # wearing one. `-U` forces every SNAPSHOT (this one and any other) to be checked against
      # the remote repository on every run, trading a little time for never resolving stale.
      - name: Build and test
        run: mvn -B -U --no-transfer-progress verify

      # What no test can see: a test runs with the whole build's classpath, and the jar carries
      # only what the pom says it does. A program with an example is what tells them apart,
      # because checking an example means running it.
      - name: Compile a program with the jar the build produced
        run: |
          mkdir -p /tmp/asked
          cat > /tmp/asked/shipping.sou <<'SOURCE'
          module shipping

          data Parcel = { weight: Int }

          behavior fee : (total: Int) -> Int

          let fee (total) = if total >= 5000 then 0 else 500
          SOURCE
          cat > /tmp/asked/shipping.examples.sou <<'SOURCE'
          examples for shipping

          example fee
              | "five thousand is free" : (5000) -> 0
              | "under it is five hundred" : (4999) -> 500
          SOURCE
          java -jar target/*-cli.jar /tmp/asked -o /tmp/asked/out.wasm --wit /tmp/asked/out.wit
          test -s /tmp/asked/out.wasm
          test -s /tmp/asked/out.wit

      # Whether what was written is a component is the format's question, and nothing in the JVM
      # can be asked it. The tests read a component back out of its own bytes, which says the
      # sections hold what they were meant to hold and nothing about whether the index in one
      # section names the thing in another — and a component that reaches out is almost entirely
      # indices between sections.
      - name: Install wasm-tools
        run: |
          version=1.258.0
          curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v$version/wasm-tools-$version-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          echo "/tmp/wasm-tools-$version-x86_64-linux" >> "$GITHUB_PATH"
      - name: Require every component this writes to be one
        run: |
          mkdir -p /tmp/component
          cat > /tmp/component/rates.sou <<'SOURCE'
          module rates

          behavior today : (pair: String) -> Decimal

          behavior priced : (n: Decimal) -> Decimal depends on today

          let priced (n, today) = n * today("JPY")
          SOURCE
          for source in /tmp/asked /tmp/component; do
            java -jar target/*-cli.jar "$source" --component \
              -o "$source/out.wasm" --wit "$source/out.wit"
            wasm-tools validate --features all "$source/out.wasm"
            wasm-tools component wit "$source/out.wasm" > "$source/read-back.wit"
          done
          # What it says it needs is what it says it needs whichever end says it.
          grep -q 'import souther:reached/rates' /tmp/component/out.wit
          grep -q 'import souther:reached/rates' /tmp/component/read-back.wit
          grep -q 'export souther:decode/shipping' /tmp/asked/out.wit
          grep -q 'export souther:decode/shipping' /tmp/asked/read-back.wit
          # A call that ended is answered as the err of a result, and both ends say so.
          grep -q 'fee: func(arguments: string) -> result<string, ended>' /tmp/asked/out.wit
          grep -q 'fee: func(arguments: string) -> result<string, ended>' /tmp/asked/read-back.wit
          # What a program asks for answers a string; a call the host ended is the host's to say.
          grep -q 'today: func(arguments: string) -> string' /tmp/component/read-back.wit
          # Each WIT file this writes is one a reader of interfaces reads.
          wasm-tools component wit /tmp/asked/out.wit > /dev/null
          wasm-tools component wit /tmp/component/out.wit > /dev/null

      # Validating says each index names something of the right type, and not that a function
      # lifts the right one: every function here takes a string and answers the same result, so a lift
      # naming another behavior's core function, or another type's reading, is still valid. A
      # component runtime calling each one is what tells them apart.
      - name: Install wasmtime
        run: |
          version=47.0.4
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v$version/wasmtime-v$version-x86_64-linux.tar.xz" \
            | tar xJ -C /tmp
          echo "/tmp/wasmtime-v$version-x86_64-linux" >> "$GITHUB_PATH"
      - name: Call each function a component this writes offers
        run: |
          answers() {
            got=$(wasmtime run --invoke "$1" /tmp/asked/out.wasm)
            if [ "$got" != "$2" ]; then
              echo "$1 answered $got, where $2 was expected"
              exit 1
            fi
          }
          answers 'fee("[4999]")' 'ok("{\"value\":500}")'
          answers 'parcel("{\"weight\":2}")' 'ok("{\"value\":{\"weight\":2}}")'
          answers 'parcel("{}")' 'ok("{\"issues\":[{\"path\":\"/weight\",\"code\":\"required\",\"messageKey\":\"required\",\"meta\":{}}]}")'
          # Text that is not JSON ends the call, and a component says why rather than trapping:
          # an instance that has trapped cannot be asked anything again.
          answers 'fee("nope")' 'err({reason: 3})'
          answers 'parcel("{")' 'err({reason: 3})'

      # The example is a program compiled by this and then called from a browser. Nothing else
      # here calls a compiled program from outside the JVM, so it is the only place that would
      # notice the boundary changing shape — and only while it is still built.
      #
      # The oldest Node the glue says it runs on is the one it is built and tested on here. The
      # engines field and this are one statement, so this reads it there: a version written here
      # as well would let a test pass on a Node the glue no longer promises, and the promise go
      # unkept on the one it does.
      - name: Read the oldest Node the glue runs on
        id: floor
        run: |
          floor=$(jq -r '.engines.node' packages/wasm/package.json)
          if [[ ! "$floor" =~ ^\>=([0-9]+)$ ]]; then
            echo "packages/wasm says it runs on Node $floor; write the oldest it runs on as >=N" >&2
            exit 1
          fi
          echo "node=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.floor.outputs.node }}
          cache: npm
          cache-dependency-path: |
            examples/react-cart/package-lock.json
            packages/wasm/package-lock.json

      # A lockfile copies what a package.json says of the repository's own packages, and npm ci
      # installs one whose copy of a command or of the Node it needs has gone stale.
      - name: Require every lockfile to say what its packages say
        run: node scripts/lockfiles-agree.mjs

      # What a TypeScript caller is handed: the runtime, the binding generated from a module, and the
      # sentences Raoh's catalog writes of an issue — each held to what the compiler built above
      # writes, the binding to a page that stops compiling when the model it reads changes, and the
      # issues and their sentences to the same fixtures the JVM and the wasm module are held to.
      - name: Test the TypeScript package
        working-directory: packages/wasm
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: Build the example
        working-directory: examples/react-cart
        run: |
          npm ci
          npm run build
          test -s dist/cart.wasm

      # Building it says the page compiles. It says nothing about whether the calling works, and
      # the calling is the only thing outside the JVM that reads this boundary — the numbers a
      # reason goes by, where a failure record's fields are, which way round a pointer and a length
      # come back. So the glue is run against a module, by the same file the page loads.
      - name: Call a compiled program through the glue the page uses
        working-directory: examples/react-cart
        run: node check.ts

  runtime:
    # The compiled runtime is carried in the repository so that building the Java half needs no
    # Rust. That only holds while the two agree, and nothing but this notices when they stop:
    # every test would keep passing against the copy that is checked in.
    #
    # On x86-64 Linux, which is the host runtime/build.sh builds on: what the runtime compiles to
    # follows the host's triple through the hash Cargo gives a dependency with a build script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: rustup show
        working-directory: runtime
      - name: Build the runtime
        run: cargo build --release --target wasm32-unknown-unknown
        working-directory: runtime
      - name: Require the carried runtime to be what the source builds
        run: |
          built=runtime/target/wasm32-unknown-unknown/release/souther_wasm_runtime.wasm
          carried=src/main/resources/souther/wasm/runtime.wasm
          if ! cmp -s "$built" "$carried"; then
            echo "The runtime carried in src/main/resources is not what runtime/src builds."
            echo "Rebuild it with runtime/build.sh, which builds on this host as CI does, and commit the result."
            cmp "$built" "$carried" || true
            exit 1
          fi
